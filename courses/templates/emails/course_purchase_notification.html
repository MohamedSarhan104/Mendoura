{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New course purchase</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f1fa; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f1fa; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e5e2f0;">

          <!-- header -->
          <tr>
            <td style="background:linear-gradient(135deg,#22d3ee,#7c3aed); padding:28px 32px; text-align:center;">
              <img src="https://mendoura.com{% static 'img/logo.png' %}" alt="Mendoura" width="40" height="40" style="display:inline-block; vertical-align:middle; border:0;">
              <span style="display:inline-block; vertical-align:middle; margin-left:10px; font-size:19px; font-weight:700; color:#ffffff; letter-spacing:0.02em;">Mendoura</span>
            </td>
          </tr>

          <!-- body -->
          <tr>
            <td style="padding:36px 32px 8px;">
              <p style="margin:0 0 4px; font-size:13px; font-weight:600; color:#7c3aed; text-transform:uppercase; letter-spacing:0.04em;">Internal Notice</p>
              <h1 style="margin:0 0 20px; font-size:22px; line-height:1.3; color:#1b1a24;">New course purchase</h1>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 8px; font-size:14px; line-height:1.8; color:#1b1a24;">
                <tr>
                  <td style="width:140px; color:#8a8798; vertical-align:top; padding:4px 0;">Student</td>
                  <td style="font-weight:600; padding:4px 0;">{{ student_name }}</td>
                </tr>
                <tr>
                  <td style="color:#8a8798; vertical-align:top; padding:4px 0;">Course</td>
                  <td style="padding:4px 0;">{{ course_title }}</td>
                </tr>
                <tr>
                  <td style="color:#8a8798; vertical-align:top; padding:4px 0;">Amount paid</td>
                  <td style="padding:4px 0;">{{ amount }} {{ currency }}</td>
                </tr>
                <tr>
                  <td style="color:#8a8798; vertical-align:top; padding:4px 0;">Purchased</td>
                  <td style="padding:4px 0;">{{ purchased_at|date:"F d, Y H:i" }} UTC</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td style="padding:20px 32px; border-top:1px solid #eeecf5; text-align:center;">
              <p style="margin:0; font-size:12px; color:#a7a3b8;">
                &copy; 2026 Mendoura
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
